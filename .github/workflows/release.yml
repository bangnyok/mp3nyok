name: Build APK & Release

# Trigger:
#   1. Push tag version, contoh: git tag v1.0.0 && git push origin v1.0.0
#   2. Manual: Actions tab -> Build APK & Release -> Run workflow
# APK akan attach ke GitHub Release (tag) atau sebagai artifact (manual).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: gradle assembleRelease -PupdateToken="${{ secrets.UPDATE_TOKEN }}" --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/wamp3-${GITHUB_REF_NAME}.apk
          ls -la dist/

      - name: Create GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wamp3-apk
          path: dist/*.apk
